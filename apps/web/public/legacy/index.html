<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>دارا | مدیریت مالی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <nav id="nav" aria-label="ناوبری اصلی"></nav>
      <main id="m" aria-live="polite">
        <section class="card">در حال بارگذاری داشبورد…</section>
      </main>
    </div>
    <dialog id="dlg"></dialog>
    <script>
      window.DARA_USER_ID = "preview";
      window.DARA_BOOT_ERROR = "";
      const workspaceStorageKey = (key) => {
        const userId = window.DARA_USER_ID;
        const suffix = userId === "preview" ? "preview" : userId;
        return {
          dashboard: `dara.v2.${userId}`,
          assets: `dara.assets.${suffix}.v1`,
          blockchain: `dara.phase4.${suffix}.v1`,
          preferences: `dara.phase5.${suffix}.v1`,
          reminders: `dara.phase5.events.${suffix}.v1`,
        }[key];
      };
      const requestHeaders = { "X-Requested-With": "dara" };
      async function prepareUserWorkspace() {
        if (new URLSearchParams(location.search).get("preview") === "1") return;
        try {
          const profile = await fetch("/api/me", {
            credentials: "same-origin",
            headers: requestHeaders,
          });
          if (profile.status === 401) return;
          if (!profile.ok) throw new Error("بررسی نشست کاربر ناموفق بود.");
          const user = await profile.json();
          window.DARA_USER_ID = user.id;
          const workspaceResponse = await fetch("/api/finance/workspace", {
            credentials: "same-origin",
            headers: requestHeaders,
          });
          if (!workspaceResponse.ok)
            throw new Error("دریافت اطلاعات ذخیره‌شده از سرور ناموفق بود.");
          const workspace = await workspaceResponse.json();
          for (const [key, storageKey] of Object.entries({
            dashboard: workspaceStorageKey("dashboard"),
            assets: workspaceStorageKey("assets"),
            blockchain: workspaceStorageKey("blockchain"),
            preferences: workspaceStorageKey("preferences"),
            reminders: workspaceStorageKey("reminders"),
          })) {
            if (Object.prototype.hasOwnProperty.call(workspace, key)) {
              localStorage.setItem(storageKey, JSON.stringify(workspace[key]));
            } else {
              const localValue = localStorage.getItem(storageKey);
              if (localValue !== null) {
                const data = JSON.parse(localValue);
                const saved = await fetch(`/api/finance/workspace/${key}`, {
                  method: "PUT",
                  credentials: "same-origin",
                  headers: { ...requestHeaders, "Content-Type": "application/json" },
                  body: JSON.stringify({ data }),
                });
                if (!saved.ok) throw new Error("انتقال دادهٔ محلی به سرور ناموفق بود.");
              }
            }
          }
        } catch (error) {
          window.DARA_BOOT_ERROR =
            error instanceof Error ? error.message : "آماده‌سازی داده‌های حساب ناموفق بود.";
        }
      }
      const loadApp = () => {
        const app = document.createElement("script");
        app.src = "app.js";
        document.body.append(app);
      };
      const loadPhase5 = () => {
        const phase5Core = document.createElement("script");
        phase5Core.src = "phase5-core.js";
        phase5Core.onerror = () => {
          document.getElementById("m").innerHTML =
            '<section class="card">بارگذاری هستهٔ حریم خصوصی و گزارش‌ها ناموفق بود.</section>';
          loadApp();
        };
        phase5Core.onload = () => {
          const phase5Ui = document.createElement("script");
          phase5Ui.src = "phase5-ui.js";
          phase5Ui.onerror = () => {
            document.getElementById("m").innerHTML =
              '<section class="card">بارگذاری رابط فاز پنجم ناموفق بود.</section>';
            loadApp();
          };
          phase5Ui.onload = loadApp;
          document.body.append(phase5Ui);
        };
        document.body.append(phase5Core);
      };
      const loadPhase4 = () => {
        const phase4Core = document.createElement("script");
        phase4Core.src = "phase4-core.js";
        phase4Core.onerror = () => {
          document.getElementById("m").innerHTML =
            '<section class="card">بارگذاری ماژول بلاک‌چین و ژورنال ناموفق بود.</section>';
          loadPhase5();
        };
        phase4Core.onload = () => {
          const phase4Ui = document.createElement("script");
          phase4Ui.src = "phase4-ui.js";
          phase4Ui.onerror = () => {
            document.getElementById("m").innerHTML =
              '<section class="card">بارگذاری رابط بلاک‌چین و ژورنال ناموفق بود.</section>';
            loadPhase5();
          };
          phase4Ui.onload = loadPhase5;
          document.body.append(phase4Ui);
        };
        document.body.append(phase4Core);
      };
      function loadFeatures() {
        const assetsCore = document.createElement("script");
        assetsCore.src = "assets-core.js";
        assetsCore.onerror = () => {
          document.getElementById("m").innerHTML =
            '<section class="card">بارگذاری ماژول دارایی‌ها ناموفق بود. اتصال و فایل‌های برنامه را بررسی کنید.</section>';
        };
        assetsCore.onload = () => {
          const assetsUi = document.createElement("script");
          assetsUi.src = "assets-ui.js";
          assetsUi.onload = () => {
            const marketsUi = document.createElement("script");
            marketsUi.src = "markets-ui.js";
            marketsUi.onload = loadPhase4;
            marketsUi.onerror = loadPhase4;
            document.body.append(marketsUi);
          };
          document.body.append(assetsUi);
        };
        document.body.append(assetsCore);
      }
      prepareUserWorkspace().finally(loadFeatures);
    </script>
  </body>
</html>
