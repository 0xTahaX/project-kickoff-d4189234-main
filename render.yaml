services:
  - type: web
    name: dara
    runtime: node
    plan: free
    # NODE_ENV=production makes npm omit devDependencies; the build needs tsc, prisma and vite,
    # so dev dependencies must be installed explicitly. Runtime also needs the prisma CLI for migrate deploy.
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: DATABASE_SSL_CA_FILE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
